<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙哥六六六</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #2a1a3e 100%);
    min-height: 100vh;
    overflow: hidden;
    cursor: default;
    font-family: 'Arial', sans-serif;
  }

  #balloon-container {
    position: fixed;
    bottom: -200px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    animation: rise 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes rise {
    0%   { bottom: -200px; }
    100% { bottom: 42vh; }
  }

  .balloon-float {
    animation: float 2s ease-in-out infinite alternate;
  }
  .balloon-float.active {
    animation: rise 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
               float 2s ease-in-out 3s infinite alternate;
  }

  @keyframes float {
    0%   { transform: translateY(0px) rotate(-3deg); }
    100% { transform: translateY(-20px) rotate(3deg); }
  }

  #balloon {
    width: 100px;
    height: 120px;
    background: radial-gradient(circle at 35% 30%, #ff6666, #cc0000 60%, #880000);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 8px 24px rgba(255,0,0,0.7)) drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    transition: transform 0.1s;
  }
  #balloon:hover {
    filter: drop-shadow(0 8px 32px rgba(255,80,80,0.9)) drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    transform: scale(1.05);
  }

  #balloon::before {
    content: '';
    position: absolute;
    top: 18%;
    left: 22%;
    width: 20px;
    height: 30px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  #balloon::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 14px solid #880000;
  }

  #balloon-knot {
    width: 12px;
    height: 12px;
    background: #660000;
    border-radius: 50%;
    margin: -2px auto 0;
    position: relative;
    left: 0;
  }

  #balloon-string {
    width: 2px;
    height: 80px;
    background: linear-gradient(180deg, #aaa 0%, #888 100%);
    margin: 0 auto;
    border-radius: 1px;
    position: relative;
  }

  /* Particles */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
  }

  /* Firework stars */
  .fw-star {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    font-size: 18px;
    animation: fw-fly var(--dur) ease-out forwards;
  }

  @keyframes fw-fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
  }

  /* Text container */
  #text-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 30;
    pointer-events: none;
  }

  .letter {
    display: inline-block;
    font-size: 10px;
    font-weight: 900;
    opacity: 0;
    text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
    animation: letter-grow var(--grow-dur) ease-out var(--delay) forwards;
  }

  @keyframes letter-grow {
    0%   { font-size: 10px; opacity: 0; }
    30%  { opacity: 1; }
    80%  { font-size: 120px; opacity: 1; }
    100% { font-size: 200px; opacity: 0; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="balloon-container">
  <div id="balloon-wrap" class="balloon-float">
    <div id="balloon"></div>
    <div id="balloon-knot"></div>
    <div id="balloon-string"></div>
  </div>
</div>

<div id="text-container">
  <span class="letter" style="color:#ff4466; --grow-dur:2.5s; --delay:0.0s;">龙</span>
  <span class="letter" style="color:#ffcc00; --grow-dur:2.5s; --delay:0.3s;">哥</span>
  <span class="letter" style="color:#44ff88; --grow-dur:2.5s; --delay:0.6s;">六</span>
  <span class="letter" style="color:#44ccff; --grow-dur:2.5s; --delay:0.9s;">六</span>
  <span class="letter" style="color:#ff88ff; --grow-dur:2.5s; --delay:1.2s;">六</span>
</div>

<canvas id="fw-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:25;"></canvas>

<script>
  const canvas = document.getElementById('fw-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  const balloon = document.getElementById('balloon');
  const balloonContainer = document.getElementById('balloon-container');
  const textContainer = document.getElementById('text-container');
  let exploded = false;
  let particles = [];
  let animating = false;

  const COLORS = ['#ff4466','#ff8800','#ffcc00','#44ff88','#44ccff','#aa66ff','#ff66cc','#ffffff'];

  function createParticles(x, y) {
    for (let i = 0; i < 180; i++) {
      const angle = (Math.PI * 2 / 180) * i + Math.random() * 0.2;
      const speed = 3 + Math.random() * 9;
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const size = 3 + Math.random() * 5;
      const trail = Math.random() > 0.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color,
        size,
        alpha: 1,
        gravity: 0.15 + Math.random() * 0.1,
        decay: 0.012 + Math.random() * 0.015,
        trail,
        history: []
      });
    }
    // extra sparks
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 14;
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color,
        size: 2 + Math.random() * 3,
        alpha: 1,
        gravity: 0.2,
        decay: 0.02 + Math.random() * 0.02,
        trail: false,
        history: []
      });
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      if (p.alpha <= 0) continue;
      alive = true;
      if (p.trail) {
        p.history.push({ x: p.x, y: p.y });
        if (p.history.length > 8) p.history.shift();
        for (let i = 0; i < p.history.length; i++) {
          const a = (i / p.history.length) * p.alpha * 0.5;
          ctx.beginPath();
          ctx.arc(p.history[i].x, p.history[i].y, p.size * (i / p.history.length), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = a;
          ctx.fill();
        }
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.alpha -= p.decay;
    }
    if (alive) {
      requestAnimationFrame(animateParticles);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  balloon.addEventListener('click', () => {
    if (exploded) return;
    exploded = true;

    const rect = balloon.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    // hide balloon
    balloonContainer.classList.add('hidden');

    // burst particles
    createParticles(cx, cy);
    animateParticles();

    // show text after short delay
    setTimeout(() => {
      textContainer.style.display = 'block';
    }, 300);
  });
</script>
</body>
</html>
